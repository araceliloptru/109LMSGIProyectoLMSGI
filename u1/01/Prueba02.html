<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Trabajando tablas</title>
    <style>
        table{border: 1px solid black;}
        td,th{border: 1px solid orange;}
        </style>

</head>
<body>
    <header><h1>Trabajando con tablas</h1></header>
    <article>   
        <h2>Tabla 1</h2>
        <table>
            <colgroup span="1" style="background-color: violet;"/>
            <colgroup span="1" style="background-color: pink;"/>
            
            <caption>
                Tabla de ejemplo
            </caption>
            <thead>
                <tr>
                    <th>Mes</th>
                    <th>Precipitacion</th>
            </thead>
            <tbody>
                <tr>
                    <th>Enero</th>
                    <td>23,5</td>
                </tr>
                <tr>
                    <th>Marzo</th>
                    <td>Total</td>
                </tr>   
            </tbody>
            <tfoot>
                <tr>
                    <th>Total</th>
                    <td>113</td>
                </tr>
            </tfoot>
        </table>
    </article>
    <article>
        <table>
            <tbody>
                <h2>Tabla 2</h2>
                <tr>
                    <td>Celda</td>
                    <td>Celda</td>
                    <td>Celda</td>
                    <td>Celda</td>
                </tr>
                <tr>
                    <td colspan="2">Celda cs2</td>
                    <td>Celda</td>
                    <td>Celda</td>
                </tr>
                <tr>
                    <td colspan="3">Celda cs3</td>
                    <td>Celda</td>
                </tr>
                <tr>
                    <td colspan=""4">Celda cs4</td>
                </tr>
            </tbody>
        </table>
    </article>
    <article>
        <table>
            <tbody>
                <h2>Tabla 3</h2>
                <tr>
                    <td>Celda</td>
                </tr>
                <tr></tr>
                    <td>Celda</td>
                </tr>
                <tr>
                    <td rowspan="2" colspan="2">Celda rs2</td>
                </tr>
                <tr>
                    <td rowspan="3">Celda rs3</td>
                </tr>
            </tbody>
        </table>
    </article>
</body>
</html>
