<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ejemplo 1 DOM</title>
  <!-- defer indica que se ejecuta cuando el DOM esta-->
  <script src="js/script.js" defer></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    footer {
      margin-top: auto;
      background-color: #383838;
      color: white;
      text-align: center;
      padding: 10px 0;
    }

    footer button {
      background-color: rgb(0, 156, 240);
      color: white;
      border: none;
      padding: 10px 15px;
      margin: 5px;
      cursor: pointer;
      border-radius: 5px;
    }

    footer button:hover {
      background-color: #0056b3;
    }

    footer p a:hover {
      text-decoration: underline;
      /* Subrayado al pasar el mouse */
      
    }
    
  </style>
</head>

<body id="cuerpo">
  <h1 id="titulo">Cambiar </h1>
  <p class="parrafo">Este es un párrafo 1 .</p>
  <p class="parrafo">Este es un párrafo 2 .</p>
  <p class="parrafo">Este es un párrafo 3 .</p>
  <footer id="footer">
    <button id="boton1">Saludar</button>
    <button id="boton2">Fondo Oscuro</button>
    <button id="boton3">Cambiar Parrafos</button>
    <p>Todos los derechos reservados a Araceli López Trujillo</p>
  </footer>
</body>

</html>
